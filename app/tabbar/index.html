<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="tabbar.css">
</head>
<body>
  <div id="tabs"></div>
  <button id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
    <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
  </button>
  <div id="drag"></div>
  <div id="controls">
    <button id="minimize" aria-label="Minimize">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 6.5l4 4 4-4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
    </button>
    <button id="maximize" aria-label="Maximize">
      <svg class="max" viewBox="0 0 16 16" width="16" height="16"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      <svg class="restore" viewBox="0 0 16 16" width="16" height="16"><path d="M8 3l5 5-5 5-5-5z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
    </button>
    <button id="close-window" aria-label="Close">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>
  <script src="icons.js"></script>
  <script src="tabbar.js"></script>
</body>
</html>
